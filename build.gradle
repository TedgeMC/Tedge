import java.nio.file.Files
import java.nio.file.Path

plugins {
    id 'java'
    id 'shade' version '1.0'
}

group = 'pl.olafcio.tedge'
version = project.version

repositories {
    mavenCentral()
}

var urlDependencies = new String[]{
        "https://github.com/TedgeMC/Tedge-Mixin/releases/download/${project.mixin}/TedgeMixin-${project.mixin}.jar",
        "https://github.com/TedgeMC/AccessEditors/releases/download/${project.accesseditors}/AccessEditors-${project.accesseditors}.jar"
}

var libsFolder = projectDir.toPath().resolve("libs")
if (!Files.exists(libsFolder)) {
    Files.createDirectory(libsFolder)

    for (var raw : urlDependencies) {
        var url = URI.create(raw).toURL()
        var conn = url.openConnection()

        conn.setDoInput(true)
        conn.connect()

        try (var stream = conn.getInputStream()) {
            var jar = stream.readAllBytes()

            Files.write(libsFolder.resolve(raw.split("/")[-1]), jar)
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly files(Path.of("${System.getenv("USERPROFILE")}/.gradle/caches/Tedge-ML/${project.minecraft}/client-only-transformed.jar"))
    compileOnly files(Path.of("${System.getenv("USERPROFILE")}/.gradle/caches/Tedge-ML/${project.minecraft}/server-only-transformed.jar"))
    compileOnly files(Path.of("${System.getenv("USERPROFILE")}/.gradle/caches/Tedge-ML/${project.minecraft}/shared-transformed.jar"))

    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'tools.jackson.core:jackson-core:3.2.1'
    implementation 'tools.jackson.core:jackson-databind:3.2.1'
    implementation 'org.jspecify:jspecify:1.0.0'
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'
    implementation 'org.yaml:snakeyaml:2.2'

    implementation files(rootProject.fileTree("libs"))
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes("Main-Class": "pl.olafcio.tedge.Main",
                   "Premain-Class": 'pl.olafcio.tedge.Agent',
                   "Can-Redefine-Classes": 'true',
                   "Can-Retransform-Classes": 'true',
                   "Can-Set-Native-Method-Prefix": 'true')
    }

    shade {
        runtimeClasspath("TedgeMixin-(.*)")
        runtimeClasspath("AccessEditors-(.*)")
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
