import java.nio.file.Path

plugins {
    id 'java'
}

group = 'pl.olafcio.tedge'
version = project.version

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly files(Path.of("${System.getenv("USERPROFILE")}/.gradle/caches/Tedge-ML/${project.minecraft}/client-transformed.jar"))

    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.jspecify:jspecify:1.0.0'
    implementation 'org.ow2.asm:asm:9.10.1'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes("Main-Class": "pl.olafcio.tedge.Main",
                   "Premain-Class": 'pl.olafcio.tedge.Agent',
                   "Can-Redefine-Classes": 'true',
                   "Can-Retransform-Classes": 'true',
                   "Can-Set-Native-Method-Prefix": 'true')
    }
}
